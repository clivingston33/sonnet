<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Sonnet</title>
    <!-- The same colours, radii and sizes as the server's sign-in page (app/ui.tsx). -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
        background: #1e1e1e;
        color: #f2f2f2;
        font: 14px/20px system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      form {
        width: 440px;
        max-width: 100%;
        padding: 32px;
        border-radius: 28px;
        background: #2c2c2e;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .logo {
        display: block;
        width: 36px;
        height: 36px;
        fill: currentColor;
      }
      h1 {
        margin-top: 12px;
        font: bold 28px/34px Georgia, serif;
      }
      p {
        margin-top: 6px;
        color: #a0a0a0;
      }
      #docs {
        display: block;
        width: fit-content;
        margin: 4px auto 0;
        font-size: 13px;
        color: #a0a0a0;
        text-decoration: none;
      }
      #docs:hover {
        color: #fff;
      }
      label {
        display: block;
        margin: 24px 0 4px;
        font-size: 12px;
        font-weight: bold;
        color: #a0a0a0;
      }
      input {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        outline: none;
        background: rgba(255, 255, 255, 0.05);
        color: inherit;
        font: inherit;
      }
      input:focus {
        border-color: rgba(255, 255, 255, 0.5);
      }
      #error {
        min-height: 20px;
        margin-top: 12px;
        font-size: 13px;
        color: #ff6b61;
      }
      button {
        width: 100%;
        height: 38px;
        margin-top: 12px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font: bold 13px system-ui, sans-serif;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.85);
      }
      button:disabled {
        opacity: 0.6;
      }
      button:focus-visible {
        outline: 2px solid #1c9be6;
        outline-offset: 2px;
      }
      /* The second choice: the app's small grey button. */
      #connect,
      #found button,
      #host {
        background: rgba(255, 255, 255, 0.1);
        color: inherit;
      }
      #connect:hover,
      #found button:hover,
      #host:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      #lan {
        font-size: 12px;
        line-height: 17px;
      }
      #lan b {
        color: #f2f2f2;
        user-select: text;
      }
      .or {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 28px;
        font-size: 12px;
        color: #8c8c8c;
      }
      .or::before,
      .or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }
      ::selection {
        background: rgba(28, 155, 230, 0.45);
      }
    </style>
  </head>
  <body>
    <form novalidate>
      <!-- The Sonnet flower: the same drawing as app/icon.svg. -->
      <svg class="logo" viewBox="-64 -64 128 128" aria-hidden="true">
        <defs>
          <path id="petal" fill-rule="evenodd" d="M0 0C-5-13-23-21-22-37C-21-50 21-50 22-37C23-21 5-13 0 0ZM0-9C-2-15-9-20-8.500-28C-8-35 8-35 8.500-28C9-20 2-15 0-9Z" />
        </defs>
        <g transform="scale(1.2)">
          <use href="#petal" transform="rotate(8) skewX(-14)" />
          <use href="#petal" transform="rotate(80) skewX(-14)" />
          <use href="#petal" transform="rotate(152) skewX(-14)" />
          <use href="#petal" transform="rotate(224) skewX(-14)" />
          <use href="#petal" transform="rotate(296) skewX(-14)" />
        </g>
      </svg>
      <h1>Welcome to Sonnet</h1>
      <p>Keep your library on this computer: nothing to set up, and it works without the internet.</p>
      <button type="button" id="local" autofocus>Use This Computer</button>
      <div class="or">or use a Sonnet server</div>
      <!-- Filled in by connect.js with the servers that answer on the network; nothing shows if none do. -->
      <div id="found"></div>
      <label for="address">Server address</label>
      <input id="address" placeholder="192.168.1.20:3000 or https://books.example.com" spellcheck="false" />
      <button id="connect">Connect</button>
      <button type="button" id="host">Host a Server on This Computer</button>
      <p id="lan"></p>
      <div id="error" role="alert"></div>
      <!-- Opens in the browser: main.js sends links that leave the app there. -->
      <a id="docs" href="https://clivingston33.github.io/sonnet/docs.html" target="_blank">Docs</a>
    </form>
    <script src="connect.js"></script>
  </body>
</html>
