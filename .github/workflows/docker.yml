# Publishes the server image to ghcr.io/clivingston33/sonnet, so running a server needs no clone
# and no build: `docker run ghcr.io/clivingston33/sonnet`.
name: Docker
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # for the arm64 build (Raspberry Pi, most NAS boxes)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A manual run from a branch only moves `latest`.
          tags: |
            ghcr.io/clivingston33/sonnet:latest
            ${{ github.ref_type == 'tag' && format('ghcr.io/clivingston33/sonnet:{0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
